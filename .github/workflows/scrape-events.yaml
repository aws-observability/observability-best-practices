name: Refresh events from awsworkshop.io

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run event scraper
        run: |
          python3 docusaurus/scripts/scrape-events.py \
            --output docusaurus/docs/events/events.json \
            --future-only

      - name: Check for changes
        id: diff
        run: |
          if git diff --exit-code docusaurus/docs/events/events.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push branch with updated events
        if: steps.diff.outputs.changed == 'true'
        id: push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          BRANCH="events/update-$(date -u +%Y-%m-%d)"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git checkout -b "$BRANCH"
          git add docusaurus/docs/events/events.json
          git commit -m 'chore(events): Refresh events from awsworkshop.io'
          git push -u origin "$BRANCH"

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --head '${{ steps.push.outputs.branch }}' \
            --title 'chore(events): Refresh events from awsworkshop.io' \
            --body '## Automated Events Update

          This PR was automatically generated by the events scraper workflow.

          **Source:** [AWS Workshop - Cloud Operations](https://awsworkshop.io/cloudops)
          **Data feed:** `https://awsworkshop.io/data/feed.json`

          ### Changes
          - Updated `docusaurus/docs/events/events.json` with the latest events from awsworkshop.io
          - Filters to cloudops category only
          - Recurring sessions are grouped under a single event with additional dates
          - Only future events are included

          ### Review checklist
          - [ ] Event themes are correctly assigned
          - [ ] Topics are appropriate for catalog linkage
          - [ ] No duplicate events
          - [ ] `npm run build` passes'
