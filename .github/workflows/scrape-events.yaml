name: Scrape AWS Experience Events

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run event scraper
        run: |
          python3 docusaurus/scripts/scrape-events.py \
            --output docusaurus/docs/events/events.json \
            --future-only

      - name: Check for changes
        id: diff
        run: |
          if git diff --exit-code docusaurus/docs/events/events.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR with updated events
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          BRANCH="events/update-$(date -u +%Y-%m-%d)"
          git checkout -b "$BRANCH"
          git add docusaurus/docs/events/events.json
          git commit -m 'chore(events): Update events from AWS Experience calendar'
          git push -u origin "$BRANCH"

          gh pr create \
            --title 'chore(events): Update events from AWS Experience calendar' \
            --body '## Automated Events Update

          This PR was automatically generated by the events scraper workflow.

          **Source:** [AWS Experience Calendar - Cloud Operations Enablement](https://aws-experience.com/amer/smb/events/series/Cloud-Operations-Enablement)

          ### Changes
          - Updated `docusaurus/docs/events/events.json` with the latest events from the AWS Experience calendar
          - Only future events are included
          - Events are grouped by title with recurring sessions as additional dates

          ### Review checklist
          - [ ] Event themes are correctly assigned
          - [ ] Topics are appropriate for catalog linkage
          - [ ] No duplicate events
          - [ ] `npm run build` passes' \
            --label 'automated' || true
