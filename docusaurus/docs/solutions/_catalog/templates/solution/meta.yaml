# Solution meta.yaml template — copy this directory to docs/solutions/<your-slug>/
# All allowed values are defined in _catalog/taxonomy.yaml.
# Do NOT invent new values; propose taxonomy additions in a separate PR.

# --- REQUIRED FIELDS ---

# Card title displayed in the catalog UI
name: "REPLACE_ME"

# Must exactly match the directory name (lowercase, hyphens only)
slug: REPLACE_ME

# Max 200 characters. Shows on the catalog card.
description: "REPLACE_ME"

# Which group does this belong to?
# These are the ONLY visible filter chips on the homepage.
# Prefer the single most accurate group. Dual-tag only when an entry genuinely
# spans two (e.g. Java-on-EKS is compute + applications).
# Allowed: ai-ml, compute, applications, data-streaming, security, network
workload_type: [REPLACE_ME]

# What compute platform does this deploy on?
# Allowed: eks, ecs, lambda, ec2, fargate, sagemaker
compute_platform: [REPLACE_ME]

# Which observability backends are used?
# Allowed: cloudwatch, amp, amg, xray, opensearch
backends: [REPLACE_ME]

# Which telemetry signals does this cover?
# Allowed: metrics, logs, traces, profiling
signals: [REPLACE_ME]

# Primary instrumentation approach
# Allowed: otel, cwagent, prometheus, adot, custom
instrumentation: REPLACE_ME

# Lifecycle status: active, deprecated, or preview
status: active
# Approximate minutes from zero to seeing data
time_to_value_minutes: REPLACE_ME

# Date you last tested every step end-to-end (YYYY-MM-DD, must not be in the future)
last_validated: "REPLACE_ME"

# --- OPTIONAL FIELDS ---

# Explicit content type (defaults to "solution" if omitted)
# content_type: solution

# IaC artifacts shipped with this entry (e.g. [terraform], [cdk], [cloudformation])
# iac_available: []

# Partner products required (leave empty if pure AWS)
# partner_integrations: []

# GitHub repo URL if IaC accelerator exists
# accelerator_link: ""

# AWS Documentation page covering this topic (include if one exists)
# docs_link: ""

# Topic tags that link this entry to live events (must match topics in events.json)
# Allowed topics: ai-ml, aiops, applications, apm, cloudwatch, databases, devops-agent, genai, general, logs, metrics, security
# related_events: []
