# otelcol-contrib — traces pipeline only
#
# Receives OTLP from the NeMo Agent Toolkit (nat) on localhost and exports
# spans to the CloudWatch OTLP traces endpoint (X-Ray), authenticated with
# SigV4 from the ambient AWS credentials/role.
#
# Run: aws-otel-collector --config collector/collector-traces.yaml
# nat exports to: http://localhost:4318  (OTLP/HTTP)

extensions:
  sigv4auth:
    region: ${AWS_REGION}
    service: xray

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  otlp_http/xray:
    endpoint: https://xray.${AWS_REGION}.amazonaws.com
    auth:
      authenticator: sigv4auth
  # Console echo so you can see spans locally as they flow through.
  debug:
    verbosity: normal

service:
  extensions: [sigv4auth]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/xray, debug]
