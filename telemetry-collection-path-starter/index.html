<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telemetry collection path starter for CloudWatch</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1b2330; --muted: #5b6678; --border: #d7dce4;
  --accent: #0b5cad; --accent-bg: #e6f0fb; --ok: #17703a; --ok-bg: #e5f4ea;
  --warn: #8a5a00; --warn-bg: #fff3d6; --bad: #a12626; --bad-bg: #fbe7e7; --code: #eef1f5; --onaccent: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --card: #1b212b; --text: #e8ecf2; --muted: #a2adbf; --border: #343d4b;
    --accent: #6db3ff; --accent-bg: #1b2d44; --ok: #6fd391; --ok-bg: #173023;
    --warn: #f0c36b; --warn-bg: #3a2e12; --bad: #ff9a9a; --bad-bg: #3a1c1c; --code: #232a35; --onaccent: #0b1220;
  }
}
:root[data-theme="dark"] {
  --bg: #12161d; --card: #1b212b; --text: #e8ecf2; --muted: #a2adbf; --border: #343d4b;
  --accent: #6db3ff; --accent-bg: #1b2d44; --ok: #6fd391; --ok-bg: #173023;
  --warn: #f0c36b; --warn-bg: #3a2e12; --bad: #ff9a9a; --bad-bg: #3a1c1c; --code: #232a35; --onaccent: #0b1220;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); }
.top { max-width: 1480px; margin: 0 auto; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 700; display: flex; align-items: center; gap: 10px; }
.logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--onaccent); display: inline-flex; align-items: center; justify-content: center; font-size: .8rem; font-weight: 800; }
.updated { font-weight: 400; font-size: .8rem; color: var(--muted, #5f6b7a); margin-left: 10px; }
.actions { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: .9rem; }
.actions label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.banner { max-width: 1180px; margin: 0 auto 8px; padding: 8px 14px; background: var(--warn-bg); color: var(--warn); border: 1px solid var(--border); border-radius: 8px; font-size: .88rem; }
.banner-wrap { padding: 0 20px; }
main { max-width: 1480px; margin: 0 auto; padding: 8px 20px 60px; }
h1 { font-size: 2rem; line-height: 1.2; margin: 8px 0 8px; }
h2 { font-size: 1.2rem; margin: 28px 0 10px; }
h3 { font-size: 1rem; margin: 18px 0 6px; }
.lead { color: var(--muted); font-size: 1.05rem; margin: 0 0 18px; max-width: 760px; }
.hero { text-align: center; padding: 28px 0 8px; }
.hero .lead { margin-left: auto; margin-right: auto; }
.cta { display: flex; gap: 16px; justify-content: center; align-items: center; flex-wrap: wrap; margin: 16px 0 6px; }
button { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 16px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .5; cursor: not-allowed; }
button:focus-visible, .opt:focus-visible, .tab:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--onaccent); border-color: var(--accent); font-weight: 600; }
button.lg { padding: 12px 26px; font-size: 1.05rem; }
button.small { padding: 4px 10px; font-size: .85rem; border-radius: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.preset { text-align: left; display: flex; flex-direction: column; gap: 6px; height: 100%; }
.preset strong { font-size: 1rem; }
.preset .d { color: var(--muted); font-size: .9rem; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { font-size: .75rem; border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; color: var(--muted); }
.use { color: var(--accent); font-size: .9rem; margin-top: auto; }
.progress { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; margin: 6px 0 18px; }
.progress > i { display: block; height: 100%; background: var(--accent); }
.step { color: var(--muted); font-size: .9rem; }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; width: 100%; padding: 12px 14px; border-radius: 12px; }
.opt.on { border-color: var(--accent); background: var(--accent-bg); }
.glyph { flex: none; min-width: 42px; height: 42px; padding: 0 6px; border-radius: 10px; background: var(--code); color: var(--text); font-weight: 700; font-size: .85rem; display: inline-flex; align-items: center; justify-content: center; }
.opt.on .glyph { background: var(--accent); color: var(--onaccent); }
.opt strong { display: block; }
.opt small { color: var(--muted); display: block; }
.nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 22px; }
.result-head { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.pathletter { font-weight: 700; background: var(--accent); color: var(--onaccent); border-radius: 8px; padding: 2px 12px; font-size: 1.1rem; }
.layout { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 20px; align-items: start; margin-top: 14px; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.stack { position: sticky; top: 10px; }
@media (max-width: 900px) { .stack { position: static; } }
.stack dl { margin: 0; }
.stack dt { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-top: 10px; display: flex; justify-content: space-between; align-items: center; }
.stack dd { margin: 2px 0 0; font-size: .92rem; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-size: .8rem; text-decoration: underline; cursor: pointer; text-transform: none; letter-spacing: 0; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; border-radius: 0; padding: 8px 12px; color: var(--muted); }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.badge { background: var(--warn-bg); color: var(--warn); border-radius: 99px; padding: 0 7px; font-size: .75rem; margin-left: 6px; }
.diagram { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 8px; overflow-x: auto; }
.diagram svg { width: 100%; height: auto; min-width: 640px; display: block; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.tag { display: inline-block; font-size: .72rem; font-weight: 600; border-radius: 6px; padding: 1px 6px; margin-right: 6px; vertical-align: 1px; }
.tag.confirm { background: var(--warn-bg); color: var(--warn); }
.tag.src-tested { background: #d9f2e1; color: #0b5a2a; margin-right: 4px; }
.tag.src-owner { background: #e3ecfb; color: #14407f; margin-right: 4px; }
.tag.src-docs { background: var(--code); color: var(--muted); border: 1px solid var(--line, #c6c6cd); margin-right: 4px; }
.tag.internal { background: var(--code); color: var(--muted); }
.tag.roadmap { background: var(--code); color: var(--ink, inherit); border: 1px solid var(--line, #c6c6cd); }
.note { margin: 14px 0 0; padding: 10px 14px; border-left: 4px solid var(--warn, #b7791f); background: var(--warn-bg); border-radius: 4px; }
.tag.untested { background: var(--bad-bg); color: var(--bad); }
ul { margin: 0; padding-left: 20px; }
li { margin: 3px 0; }
.warnlist { padding: 0; list-style: none; }
.warn { background: var(--warn-bg); border-left: 4px solid var(--warn); padding: 6px 10px; border-radius: 6px; margin: 6px 0; }
.warn.bad { border-left-color: var(--bad); background: var(--bad-bg); }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
td.yes { color: var(--ok); font-weight: 600; } td.no { color: var(--muted); } td.part { color: var(--warn); font-weight: 600; }
tr.gap td { background: var(--bad-bg); }
tr.want td:first-child::after { content: " (you asked for this)"; color: var(--muted); font-size: .8rem; }
pre { background: var(--code); padding: 12px; border-radius: 8px; overflow: auto; font-size: .82rem; margin: 6px 0; }
.codehead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 14px; }
.small { font-size: .85rem; color: var(--muted); }
label.f { display: flex; flex-direction: column; gap: 3px; font-size: .85rem; color: var(--muted); }
input[type="text"] { font: inherit; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); min-width: 0; }
li, td, p, dd { overflow-wrap: anywhere; }
footer { max-width: 1480px; margin: 0 auto; padding: 0 20px 40px; color: var(--muted); font-size: .85rem; }
.overlay { position: fixed; inset: 0; z-index: 50; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
.ovbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
.ovbar .grow { flex: 1; }
.ovbody { flex: 1; overflow: auto; padding: 12px 16px; }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">TC</span> Telemetry collection path starter <span class="updated">Last updated 19 November 2026</span></div>
  <div class="actions">
    <button type="button" class="small" id="back-start">Back to start</button>
    <button type="button" class="small" id="theme" aria-label="Toggle light and dark theme">Theme</button>
  </div>
</header>
<main id="app"></main>
<footer>Nothing you choose leaves your browser. Diagrams are drawn from your answers. The .drawio download uses the AWS architecture icon set when opened in draw.io.</footer>

  var t = view.tab, P = r.P, h = '';
  if (t === 'diagram') {
    var m = buildModel(state, r), desc = modelText(m, state, r);
    h += '<div class="diagram">' + toSVG(m, 'Path ' + r.key + ': ' + P.name, desc, { anim: true, fluid: true }) + '</div>';
    h += '<div class="row"><button type="button" data-act="anim" aria-pressed="' + view.paused + '">' + (view.paused ? 'Play animation' : 'Pause animation') + '</button><span class="small">The dots show data moving: blue metrics, green logs, purple traces.</span></div>';
    h += '<h3>How your data flows</h3><ol>' + flowSteps(state, r, m).map(function (x) { return '<li>' + escL(x) + '</li>'; }).join('') + '</ol>';
    h += '<div class="row"><button type="button" class="primary" data-act="expand">Expand diagram</button><button type="button" data-act="open-svg">Open full size</button><button type="button" data-act="dl-svg">Download SVG</button><button type="button" data-act="dl-drawio">Download .drawio</button><span class="small">The diagram is drawn from your answers. The .drawio file opens in draw.io with the AWS architecture icons.</span></div>';
  }
  if (t === 'why') {
    h += '<h3 style="margin-top:0">Why this fits</h3><ul>' + r.reasons.map(function (x) { return '<li>' + escL(x) + '</li>'; }).join('') + '</ul>';
    h += '<h3>What you get</h3><table><thead><tr><th>Capability</th><th>This path</th></tr></thead><tbody>';
    r.rows.forEach(function (x) {
      var txt = x.v === 'yes' ? 'Yes' : x.v === 'part' ? 'Partly (app exports twice)' : 'No';
      h += '<tr class="' + (x.want ? 'want ' : '') + (x.gap ? 'gap' : '') + '"><td>' + esc(x.label) + '</td><td class="' + x.v + '">' + txt + '</td></tr>';
    });
    h += '</tbody></table><h3>Who owns what</h3><p>' + esc(P.owner) + '</p>';
    if (r.alts.length) h += '<h3>Other options</h3><ul>' + r.alts.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    h += '<h3>Rule trace</h3><label class="small"><input type="checkbox" id="t-trace"' + (view.trace ? ' checked' : '') + '> Show which rules fired</label>';
    if (view.trace) h += '<pre>' + esc(r.trace.join('\n')) + '</pre>';
  }
  if (t === 'watch') {
    if (!r.warns.length && !(view.internal && r.internal.length)) h += '<p>Nothing to watch out for with these answers.</p>';
    if (r.warns.length) h += '<ul class="warnlist">' + r.warns.map(function (w) { return '<li class="warn' + (w.bad ? ' bad' : '') + '">' + tagsFor(w) + escL(w.t) + '</li>'; }).join('') + '</ul>';
  }
  if (t === 'lang') {
    if (!r.langs.length) h += '<p>You did not pick a language. <button type="button" class="linkbtn" data-act="edit" data-n="' + stepFor('lang') + '">Add languages</button> to see whether an ADOT SDK exists for each.</p>';
    else h += '<p class="small">Versions, libraries, frameworks and instrumentation layers are out of scope here. Use the ADOT and OpenTelemetry docs.</p>';
    r.langs.forEach(function (l) {
      h += '<div class="card" style="margin-bottom:10px"><strong>' + esc(l.name) + '</strong> <span class="pill">' + (l.adot ? 'ADOT SDK available' : 'No ADOT SDK') + '</span>' +
        '<p style="margin:6px 0">' + escL(l.how) + '</p>' +
        '<p class="small" style="margin:0"><a href="' + DOCS.adotdocs[1] + '" target="_blank" rel="noopener noreferrer">ADOT docs</a> &middot; <a href="' + l.otel + '" target="_blank" rel="noopener noreferrer">OpenTelemetry docs for ' + esc(l.name) + '</a></p></div>';
    });
  }
  if (t === 'mig') {
    var M = r.mig;
    if (!M.sections.length) h += '<p>Moving Classic (V1) metrics to OpenTelemetry (V2) metrics lets you query them with PromQL and see them in Omni. Tell us which metrics you publish today to see the steps, the options and what to watch out for. <button type="button" class="linkbtn" data-act="edit" data-n="' + stepFor('mig') + '">Add your metrics</button></p>';
    else {
      h += '<p class="lead" style="margin-top:0">Classic (V1) metrics use a namespace and dimensions. V2/OTel metrics use metric names and labels, are queried with PromQL, and are the only metrics Omni supports. The two are separate stores, so a Classic metric does not appear in PromQL by itself.</p>';
      M.sections.forEach(function (sec) {
        h += '<h3>' + esc(sec.title) + '</h3>';
        var li = function (x) { return '<li>' + tagsFor(x) + escL(x.t) + '</li>'; };
        h += '<ul>' + sec.items.map(li).join('') + '</ul>';
        if (sec.table) {
          h += '<table><thead><tr>' + sec.table.head.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>' + sec.table.rows.map(function (rw) { return '<tr>' + rw.map(function (c, i) { return (i ? '<td>' : '<th scope="row">') + esc(c) + (i ? '</td>' : '</th>'); }).join('') + '</tr>'; }).join('') + '</tbody></table>';
          h += '<ul>' + sec.after.map(li).join('') + '</ul>';
        }
      });
      h += '<h3>Docs</h3><ul>' + M.docs.map(function (d) { return '<li><a href="' + DOCS[d][1] + '" target="_blank" rel="noopener noreferrer">' + esc(DOCS[d][0]) + '</a></li>'; }).join('') + '</ul>';
    }
  }
  if (t === 'setup') h += '<ul>' + r.cn.map(function (c) { return '<li><strong>' + esc(label('compute', c[0])) + ':</strong> ' + escL(c[1]) + (c[2] && c[2].length ? ' <span class="small">Docs: ' + c[2].map(function (d) { return '<a href="' + DOCS[d][1] + '" target="_blank" rel="noopener noreferrer">' + esc(DOCS[d][0]) + '</a>'; }).join(' &middot; ') + '</span>' : '') + '</li>'; }).join('') + '</ul>';
  if (t === 'config') {
    h += '<div class="row"><label class="f">Region<input type="text" id="cfg-region" value="' + esc(view.region) + '"></label>' + (has(state.signals, 'logs') ? '<label class="f">Log group<input type="text" id="cfg-lg" value="' + esc(view.logGroup) + '"></label>' : '') + '</div>';
    h += '<div id="cfg-out">' + cfgHtml(r) + '</div>';
  }
  if (t === 'docs') h += '<ul>' + r.docs.map(function (d) { return '<li><a href="' + DOCS[d][1] + '" target="_blank" rel="noopener noreferrer">' + esc(DOCS[d][0]) + '</a></li>'; }).join('') + '</ul>';
  return h;
}

function cfgHtml(r) {
  var list = genConfigs(state, r, { region: view.region, logGroup: view.logGroup }), h = '';
  list.forEach(function (c, i) {
    h += '<div class="codehead"><strong>' + esc(c.title) + '</strong><button type="button" class="small" data-act="copy-code" data-i="' + i + '">Copy</button></div>' +
      '<pre id="code-' + i + '"><code>' + esc(c.text) + '</code></pre>' + (c.note ? '<p class="small">' + esc(c.note) + '</p>' : '');
  });
  return h || '<p>No config for this path.</p>';
}

// ----- render and events -----
function render() {
  var app = document.getElementById('app'), s = view.screen;
  app.innerHTML = s === 'home' ? home() : s === 'result' ? resultScreen() : stepScreen(s);
  if (view.expanded && s === 'result' && lastResult) { app.insertAdjacentHTML('beforeend', overlayHtml()); var cb = document.getElementById('ov-close'); if (cb) cb.focus({ preventScroll: true }); }
  document.title = (s === 'result' && lastResult ? 'Path ' + lastResult.key + ' - ' : '') + 'Telemetry collection path starter for CloudWatch';
  var h1 = app.querySelector('h1'); if (h1) { h1.setAttribute('tabindex', '-1'); }
  var sv = app.querySelector('.diagram svg'); if (sv && view.paused && sv.pauseAnimations) sv.pauseAnimations();
}
function go(screen) { view.screen = screen; render(); saveHash(); window.scrollTo(0, 0); var h1 = document.querySelector('#app h1'); if (h1) h1.focus({ preventScroll: true }); }

function onAct(act, el) {
  if (act === 'start') { view.returnTo = ''; state = EMPTY(); go(1); }
  else if (act === 'preset') { view.returnTo = ''; state = Object.assign(EMPTY(), JSON.parse(JSON.stringify(PRESETS[+el.getAttribute('data-i')].s))); view.tab = 'diagram'; go('result'); }
  else if (act === 'opt') {
    var q = el.getAttribute('data-q'), v = el.getAttribute('data-v'), st = STEPS.filter(function (x) { return x.q === q; })[0];
    if (st.multi) { var i = state[q].indexOf(v); if (i === -1) state[q].push(v); else state[q].splice(i, 1); } else state[q] = v;
    var y = window.scrollY; render(); window.scrollTo(0, y); saveHash();
    var again = document.querySelector('[data-act="opt"][data-q="' + q + '"][data-v="' + v + '"]'); if (again) again.focus({ preventScroll: true });
  }
  else if (act === 'next') {
    var n = view.screen;
    if (n === STEPS.length) { var mm = missing(state); if (mm.length) { go(firstMissingStep()); } else go('result'); } else go(n + 1);
  }
  else if (act === 'back') { var n2 = view.screen; if (n2 === 1) go('home'); else go(n2 - 1); }
  else if (act === 'edit') { view.returnTo = 'result'; go(+el.getAttribute('data-n')); }
  else if (act === 'to-result') { view.returnTo = ''; go(missing(state).length ? firstMissingStep() : 'result'); }
  else if (act === 'restart') { view.returnTo = ''; state = EMPTY(); go('home'); }
  else if (act === 'tab') { view.tab = el.getAttribute('data-t'); render(); saveHash(); var tb = document.getElementById('tab-' + view.tab); if (tb) tb.focus({ preventScroll: true }); }
  else if (act === 'expand') { view.expanded = true; view.zoom = 'fit'; render(); }
  else if (act === 'collapse') { view.expanded = false; render(); var eb = document.querySelector('[data-act=expand]'); if (eb) eb.focus({ preventScroll: true }); }
  else if (act === 'zoom-fit') { view.zoom = 'fit'; render(); }
  else if (act === 'zoom-in' || act === 'zoom-out') { var cur = view.zoom === 'fit' ? Math.min(1, (window.innerWidth - 40) / (buildModel(state, lastResult).w)) : view.zoom; view.zoom = Math.max(0.3, Math.min(3, +(cur * (act === 'zoom-in' ? 1.25 : 0.8)).toFixed(2))); render(); }
  else if (act === 'anim') { view.paused = !view.paused; render(); }
  else if (act === 'copy-summary') copyText(summaryText(lastResult), el);
  else if (act === 'copy-link') copyText(location.href, el);
  else if (act === 'copy-code') { var pre = document.getElementById('code-' + el.getAttribute('data-i')); copyText(pre.textContent, el); }
  else if (act === 'open-svg') { var m0 = buildModel(state, lastResult); var url = URL.createObjectURL(new Blob([toSVG(m0, 'Path ' + lastResult.key, modelText(m0, state, lastResult))], { type: 'image/svg+xml' })); window.open(url, '_blank', 'noopener'); }
  else if (act === 'dl-svg') { var m = buildModel(state, lastResult); download('collection-path-' + lastResult.key + '.svg', toSVG(m, 'Path ' + lastResult.key + ': ' + lastResult.P.name, modelText(m, state, lastResult)), 'image/svg+xml'); }
  else if (act === 'dl-drawio') { var m2 = buildModel(state, lastResult); download('collection-path-' + lastResult.key + '.drawio', toDrawio(m2, 'Path ' + lastResult.key), 'application/xml'); }
}

function init() {
  var app = document.getElementById('app');
  app.addEventListener('click', function (e) { var t = e.target.closest('[data-act]'); if (t && !t.disabled) onAct(t.getAttribute('data-act'), t); });
  app.addEventListener('change', function (e) { if (e.target.id === 't-trace') { view.trace = e.target.checked; render(); } });
  app.addEventListener('input', function (e) {
    if (e.target.id === 'cfg-region') { view.region = e.target.value.trim() || 'us-east-1'; document.getElementById('cfg-out').innerHTML = cfgHtml(lastResult); }
    if (e.target.id === 'cfg-lg') { view.logGroup = e.target.value.trim() || 'my-app-logs'; document.getElementById('cfg-out').innerHTML = cfgHtml(lastResult); }
  });
  document.getElementById('back-start').addEventListener('click', function () { view.returnTo = ''; state = EMPTY(); go('home'); });
  document.getElementById('theme').addEventListener('click', function () {
    var root = document.documentElement, dark = root.getAttribute('data-theme') ? root.getAttribute('data-theme') === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-theme', dark ? 'light' : 'dark');
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && view.expanded) { view.expanded = false; render(); } });
  loadHash(); render();
}
if (typeof document !== 'undefined') init();
</script>
</body>
</html>
